[package]
name = "local-files"
version = "2.1.2"
edition = "2024"
rust-version = "1.88"
description = "Native tray controller and read-only MCP filesystem server"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:tao", "dep:tray-icon", "dep:rfd", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:windows-sys"]

[dependencies]
anyhow = "1"
base64 = "0.22"
cap-std = "4.0.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
fs4 = "1.1"
memchr = "2"
libc = "0.2"
percent-encoding = "2"
regex = "1"
rmcp = { version = "3.5.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tao = { version = "0.35.3", default-features = false, features = ["rwh_06"], optional = true }
tray-icon = { version = "0.24.2", default-features = false, optional = true }
rfd = { version = "0.17.2", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
plist = "1.10"
objc2 = { version = "0.6.4", optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSGeometry"], optional = true }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSResponder", "NSTextField", "NSSecureTextField", "NSView", "NSWindow"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security_Credentials", "Win32_Globalization"], optional = true }

[[bin]]
name = "local-files"
path = "native/main.rs"

[[bin]]
name = "local-files-installer"
path = "native/installer.rs"
required-features = ["desktop"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
